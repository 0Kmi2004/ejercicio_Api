<ion-content>
 <ion-label>Datos de servidor</ion-label>
 <ion-list>
 <ion-item *ngFor="let usuario of usuarios">
 <ion-card>{{usuario.nombre}} - {{usuario.email}}</ion-card>
 </ion-item>
 </ion-list>

<ion-searchbar
  [(ngModel)]="textoBusqueda"
  (ionInput)="filtrarUsuarios()"
  placeholder="Buscar por nombre o email">
</ion-searchbar>

<ion-text color="danger" *ngIf="error">
  <p class="ion-padding">
    {{ error }}
  </p>
</ion-text>

<ion-list>
  <ion-item 
    *ngFor="let usuario of usuariosFiltrados"
    (click)="verDetalle(usuario)"
    button>
    
    <ion-label>
      <h2>{{ usuario.nombre }}</h2>
      <p>{{ usuario.email }}</p>
    </ion-label>

  </ion-item>
</ion-list>
<ion-text color="danger" *ngIf="error">
  <p class="ion-padding">{{ error }}</p>
</ion-text>
 </ion-content>
